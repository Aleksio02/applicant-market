server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/applicant_market
    username: applicant_market
    password: applicant_market
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
  mail:
    protocol: smtps
    host: smtp.example.com
    port: 465
    username: no-reply@example.com
    password: change-me
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  data:
    redis:
      host: localhost
      port: 6379
      password: am_token
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

app:
  consents:
    data-processing-version: 1
    profile-publication-version: 1
    contact-reveal-version: 1

applicant:
  grade-change:
    cooldown: 90d