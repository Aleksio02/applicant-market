server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/applicant_market
    username: applicant_market
    password: applicant_market
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
  mail:
    host: smtp.yandex.ru
    port: 465
    username: applicant-market@yandex.ru
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.yandex.ru
  data:
    redis:
      host: localhost
      port: 6379
      password: am_token
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

app:
  auth:
    email-confirmation:
      enabled: true
  mail:
    enabled: true
    from: applicant-market@yandex.ru
  consents:
    data-processing-version: 1
    profile-publication-version: 1
    contact-reveal-version: 1

applicant:
  grade-change:
    cooldown: 90d

assessment:
  session:
    expires-in: 2h
    grace-period: 0s
    retry-cooldown: 30d

  generation:
    total-items: 8
    distribution:
      below-claimed: 2
      claimed: 3
      above-claimed: 2
      random: 1
    renderer-version: v1
    max-attempts-per-template: 5
    auto-deactivate-threshold: 5

  grading:
    grade-to-difficulty:
      JUNIOR: 1
      MIDDLE: 3
      SENIOR: 4
      LEAD: 5
    thresholds:
      pass: 0.5
      promote: 0.8

matching:
  ranking:
    base-verified-match: 0.5
    base-verified-above: 0.7
    base-verified-below: 0.3
    assessment-score-weight: 0.3
    fsp-boost-per-achievement: 0.05
    fsp-boost-cap: 1.5
    freshness-threshold-days: 30
    freshness-floor: 0.8
    skill-weight: 0.7
    grade-weight: 0.3
  search:
    default-page-size: 20
    max-page-size: 100
    default-min-match-level: 0.0