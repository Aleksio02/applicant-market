# Запуск с контейнеризацией контейнеров (prod)
#   docker compose -f docker-compose.yml -f docker-compose-apps.yml up -d --build
#
# Запуск без приложений
# docker compose up -d

services:
  postgres:
    container_name: am_db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: applicant_market
      POSTGRES_USER: applicant_market
      POSTGRES_PASSWORD: applicant_market
    ports:
      - "5432:5432"
    volumes:
      - am_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U applicant_market -d applicant_market" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: am_cache
    image: redis:8.6.1-alpine
    command: redis-server --save 20 1 --loglevel warning --requirepass am_token
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "am_token", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


volumes:
  am_data:

